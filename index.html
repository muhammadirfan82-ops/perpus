<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPERPUS - Sistem Informasi Perpustakaan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Libraries for Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gov: {
                            blue: '#1e3a8a', // Kemendikdasmen deep blue
                            bluelight: '#2563eb',
                            gold: '#f59e0b', // Subtle gold/yellow accent
                            gray: '#f3f4f6',
                            text: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar-link.active {
            background-color: #f59e0b;
            color: #ffffff;
            font-weight: 600;
        }
        
        .sidebar-link { transition: all 0.2s ease-in-out; }
        .sidebar-link:hover:not(.active) { background-color: rgba(255, 255, 255, 0.1); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        /* Modal Backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }
        
        /* Print Styles for Barcode */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { 
                position: absolute; 
                left: 0; top: 0; 
                width: 100%; 
                display: flex; 
                flex-direction: column; 
                justify-content: center; 
                align-items: center; 
                padding-top: 2rem; 
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="text-gov-text h-screen flex flex-col overflow-hidden">

    <!-- Print Area -->
    <div id="print-area" class="hidden text-center bg-white w-full h-screen">
        <h2 id="print-title" class="font-bold text-xl mb-4 font-sans text-black"></h2>
        <svg id="print-barcode"></svg>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-gov-blue z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <i class="fas fa-circle-notch fa-spin fa-3x mb-4 text-gov-gold"></i>
        <h2 class="text-2xl font-bold tracking-wider">SIPERPUS</h2>
        <p class="text-sm opacity-80 mt-2" id="loading-text">Memuat Sistem...</p>
    </div>

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-4 right-4 z-[90] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center modal-backdrop opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-lg mx-4 overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col max-h-[90vh]" id="modal-content">
            <div class="bg-gov-blue p-4 flex justify-between items-center text-white shrink-0">
                <h3 id="modal-title" class="font-semibold text-lg">Judul Modal</h3>
                <button onclick="window.closeModal()" class="text-gray-300 hover:text-white transition focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="hidden flex-1 flex items-center justify-center bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');">
        <div class="absolute inset-0 bg-gov-blue bg-opacity-90"></div>
        
        <div class="relative z-10 glass-panel rounded-xl shadow-2xl p-8 w-full max-w-md mx-4 fade-in">
            <div class="text-center mb-8 flex flex-col items-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg" alt="Logo" class="w-16 h-16 mb-4 drop-shadow-md" onerror="this.src='https://placehold.co/100x100/1e3a8a/ffffff?text=Logo';">
                <h1 class="text-2xl font-bold text-gov-blue">SIPERPUS</h1>
                <p class="text-sm text-gray-600 mt-1 font-medium">Sistem Informasi Perpustakaan Terpadu</p>
            </div>
            
            <form id="login-form" class="space-y-5" onsubmit="window.handleLogin(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-user text-gray-400"></i></div>
                        <input type="text" id="login-username" required class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-gov-blue focus:border-gov-blue sm:text-sm" placeholder="Masukkan username">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-gray-400"></i></div>
                        <input type="password" id="login-password" required class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-gov-blue focus:border-gov-blue sm:text-sm" placeholder="Masukkan password">
                    </div>
                </div>
                
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-gov-blue hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gov-blue transition-colors duration-200 mt-2">
                    MASUK SISTEM
                </button>
            </form>
        </div>
    </div>

    <!-- Main Application / Dashboard View -->
    <div id="app-view" class="hidden flex-1 flex overflow-hidden h-screen bg-gov-gray w-full">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-gov-blue text-white flex-shrink-0 flex flex-col transition-all duration-300 transform -translate-x-full md:translate-x-0 fixed md:relative z-40 h-full shadow-2xl md:shadow-none">
            <!-- Sidebar Header -->
            <div class="h-16 flex items-center px-4 border-b border-blue-800 bg-blue-900 shrink-0">
                <i class="fas fa-book-reader text-gov-gold text-2xl mr-3"></i>
                <span class="font-bold text-lg tracking-wider">SIPERPUS</span>
                <button class="md:hidden ml-auto text-white p-2" onclick="window.toggleSidebar()"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- User Info -->
            <div class="p-5 border-b border-blue-800 shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-gov-gold flex items-center justify-center text-gov-blue font-bold shadow-inner text-lg" id="sidebar-user-avatar">SA</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-bold truncate text-white" id="sidebar-user-name">User Name</p>
                        <p class="text-xs text-blue-300 capitalize flex items-center gap-1 mt-0.5">
                            <i class="fas fa-shield-alt text-[10px]"></i>
                            <span id="sidebar-user-role">Role</span>
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" id="sidebar-nav">
                <!-- Links injected by JS -->
            </nav>
            
            <!-- Footer -->
            <div class="p-4 border-t border-blue-800 shrink-0">
                <button onclick="window.logout()" class="flex items-center w-full px-4 py-2.5 text-sm font-medium text-blue-100 hover:text-white hover:bg-blue-800 rounded-md transition-colors border border-transparent hover:border-blue-700">
                    <i class="fas fa-sign-out-alt mr-3"></i> Keluar Aplikasi
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden w-full relative z-10 bg-gray-50">
            <!-- Top Header -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 sm:px-6 lg:px-8 z-20 shrink-0 border-b border-gray-200">
                <div class="flex items-center">
                    <button class="md:hidden text-gray-500 hover:text-gov-blue mr-4 focus:outline-none p-2" onclick="window.toggleSidebar()">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-lg font-bold text-gray-800 border-l-4 border-gov-gold pl-3" id="topbar-title">Dashboard</h2>
                </div>
                
                <div class="flex items-center space-x-3">
                    <button onclick="window.startCameraScanner('details')" class="bg-blue-50 text-gov-blue border border-blue-200 px-3 py-1.5 rounded-md text-sm font-semibold hover:bg-gov-blue hover:text-white transition-all shadow-sm flex items-center">
                        <i class="fas fa-camera sm:mr-2"></i> <span class="hidden sm:inline">Scan Cepat</span>
                    </button>
                </div>
            </header>
            
            <!-- Dynamic Content Container -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" id="main-content">
                <!-- Views injected here -->
            </div>
        </main>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-30 hidden md:hidden backdrop-blur-sm" onclick="window.toggleSidebar()"></div>
    </div>

    <!-- Application Script -->
    <script>
        /* ==========================================================================
           1. SUPABASE INITIALIZATION
           ========================================================================== */
        
        // --- MASUKKAN KREDENSIAL SUPABASE ANDA DI SINI ---
        const SUPABASE_URL = 'https://blimhihjptvakbgrbbao.supabase.co'; // Ganti dengan URL project Anda
        const SUPABASE_ANON_KEY = 'sb_publishable_0kdE_oPP51ftVu5KEazuqw_b2e4XSPI'; // Ganti dengan Anon Key project Anda
        
        let supabaseClient;
        try {
            // Memberikan URL dummy agar script tidak crash jika belum diganti
            const initUrl = SUPABASE_URL.startsWith('http') ? SUPABASE_URL : 'https://placeholder.supabase.co';
            supabaseClient = window.supabase.createClient(initUrl, SUPABASE_ANON_KEY);
        } catch (error) {
            console.error("Gagal menginisialisasi Supabase:", error);
        }

        /* ==========================================================================
           2. STATE MANAGEMENT
           ========================================================================== */
        let usersData = [];
        let booksData = [];
        let membersData = [];
        let inventoryData = [];
        let transactionsData = [];

        let currentUserProfile = null;
        let currentView = 'dashboard';
        
        let physicalBarcode = '';
        let physicalBarcodeTimer = null;
        let html5QrcodeScanner = null;
        let currentScannerMode = 'details';

        /* ==========================================================================
           3. DATA FETCHING (ASYNC)
           ========================================================================== */
           
        async function fetchAllData() {
            try {
                showLoading("Mengambil Data dari Supabase...");
                
                // Fetch Users (if admin)
                if (currentUserProfile && (currentUserProfile.role === 'super_admin' || currentUserProfile.role === 'admin')) {
                    const { data: users } = await supabaseClient.from('users').select('*');
                    usersData = users || [];
                }
                
                // Fetch Books
                const { data: books } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
                booksData = books || [];

                // Fetch Members
                const { data: members } = await supabaseClient.from('members').select('*').order('created_at', { ascending: false });
                membersData = members || [];

                // Fetch Procurements
                const { data: procurements } = await supabaseClient.from('procurements').select(`*, books(judul)`).order('created_at', { ascending: false });
                inventoryData = procurements || [];

                // Fetch Transactions
                const { data: transactions } = await supabaseClient.from('transactions').select(`*, books(judul), members(nama_lengkap)`).order('created_at', { ascending: false });
                transactionsData = transactions || [];
                
            } catch (error) {
                console.error("Error fetching data:", error);
                showToast("Gagal memuat data dari server.", "error");
            } finally {
                hideLoading();
            }
        }

        /* ==========================================================================
           4. AUTHENTICATION
           ========================================================================== */

        async function initApp() {
            if(SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_URL.startsWith('http')) {
                showToast("Silakan konfigurasi SUPABASE_URL & KEY di kode sumber.", "warning");
            }

            const storedSession = localStorage.getItem('siperpus_session');
            if (storedSession) {
                currentUserProfile = JSON.parse(storedSession);
                await setupDashboard();
                return;
            }
            hideLoading();
            document.getElementById('login-view').classList.remove('hidden');
        }

        window.handleLogin = async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;
            
            showLoading("Memverifikasi Kredensial...");
            
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', usernameInput)
                    .eq('password', passwordInput)
                    .single();

                if (data) {
                    currentUserProfile = data;
                    localStorage.setItem('siperpus_session', JSON.stringify(data));
                    document.getElementById('login-form').reset();
                    document.getElementById('login-view').classList.add('hidden');
                    
                    showToast(`Selamat datang kembali, ${data.username}!`, "success");
                    await setupDashboard();
                } else {
                    hideLoading();
                    showToast("Username atau Password salah atau tidak ditemukan.", "error");
                }
            } catch (error) {
                hideLoading();
                showToast("Terjadi kesalahan sistem/koneksi Supabase.", "error");
                console.error(error);
            }
        };

        window.logout = () => {
            showLoading("Mengakhiri Sesi...");
            localStorage.removeItem('siperpus_session');
            currentUserProfile = null;
            setTimeout(() => {
                hideLoading();
                document.getElementById('app-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
            }, 600);
        };

        /* ==========================================================================
           5. NAVIGATION & UI SETUP
           ========================================================================== */
           
        const menuConfig = [
            { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', roles: ['super_admin', 'admin', 'petugas'] },
            { id: 'collections', label: 'Data Koleksi', icon: 'fa-book', roles: ['super_admin', 'admin', 'petugas'] },
            { id: 'members', label: 'Data Keanggotaan', icon: 'fa-id-card', roles: ['super_admin', 'admin', 'petugas'] },
            { id: 'circulation', label: 'Data Sirkulasi', icon: 'fa-exchange-alt', roles: ['super_admin', 'admin', 'petugas'] },
            { id: 'inventory', label: 'Pengadaan & Inventaris', icon: 'fa-boxes', roles: ['super_admin', 'admin'] },
            { id: 'admin', label: 'Administrasi Sistem', icon: 'fa-users-cog', roles: ['super_admin'] }
        ];

        async function setupDashboard() {
            await fetchAllData();
            document.getElementById('app-view').classList.remove('hidden');
            
            document.getElementById('sidebar-user-name').textContent = currentUserProfile.username;
            document.getElementById('sidebar-user-avatar').textContent = currentUserProfile.username.charAt(0).toUpperCase();
            
            const rolesMap = { 'super_admin': 'Super Administrator', 'admin': 'Administrator', 'petugas': 'Petugas Pustaka' };
            document.getElementById('sidebar-user-role').textContent = rolesMap[currentUserProfile.role];
            
            renderSidebarMenu();
            navigateTo('dashboard');
        }

        function renderSidebarMenu() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            menuConfig.forEach(item => {
                if (item.roles.includes(currentUserProfile.role)) {
                    const a = document.createElement('a');
                    a.href = "#";
                    a.className = `sidebar-link group flex items-center px-3 py-3 text-sm font-medium rounded-md text-blue-100 ${currentView === item.id ? 'active' : ''}`;
                    a.innerHTML = `<i class="fas ${item.icon} text-lg mr-3 w-6 text-center ${currentView === item.id ? 'text-white' : 'text-blue-300 group-hover:text-white'}"></i> ${item.label}`;
                    a.onclick = (e) => {
                        e.preventDefault();
                        navigateTo(item.id);
                        if(window.innerWidth < 768) window.toggleSidebar(); // close on mobile
                    };
                    nav.appendChild(a);
                }
            });
        }

        window.navigateTo = (viewId) => {
            currentView = viewId;
            renderSidebarMenu();
            
            const titles = {
                'dashboard': 'Dashboard Sistem',
                'collections': 'Katalog Pustaka (Data Koleksi)',
                'members': 'Manajemen Anggota',
                'circulation': 'Sirkulasi & Transaksi',
                'inventory': 'Data Pengadaan & Inventarisasi',
                'admin': 'Manajemen Pengguna (Sistem)'
            };
            document.getElementById('topbar-title').textContent = titles[viewId] || 'SIPERPUS';
            
            const container = document.getElementById('main-content');
            
            if (viewId === 'dashboard') container.innerHTML = buildDashboardView();
            else if (viewId === 'collections') container.innerHTML = buildCollectionsView();
            else if (viewId === 'members') container.innerHTML = buildMembersView();
            else if (viewId === 'circulation') container.innerHTML = buildCirculationView();
            else if (viewId === 'inventory') container.innerHTML = buildInventoryView();
            else if (viewId === 'admin') container.innerHTML = buildAdminView();
        };

        /* ==========================================================================
           6. VIEW RENDERERS (HTML Generators)
           ========================================================================== */

        function buildDashboardView() {
            const totalBooks = booksData.reduce((acc, curr) => acc + (parseInt(curr.stok) || 0), 0);
            const activeLoans = transactionsData.filter(t => t.status === 'Dipinjam').length;
            
            return `
                <div class="fade-in space-y-6">
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-5 flex items-center border-l-4 border-blue-500">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-4"><i class="fas fa-book text-xl"></i></div>
                            <div><p class="text-sm text-gray-500 font-medium">Total Eksemplar</p><p class="text-2xl font-bold text-gray-800">${totalBooks}</p></div>
                        </div>
                        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-5 flex items-center border-l-4 border-green-500">
                            <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center mr-4"><i class="fas fa-users text-xl"></i></div>
                            <div><p class="text-sm text-gray-500 font-medium">Total Anggota</p><p class="text-2xl font-bold text-gray-800">${membersData.length}</p></div>
                        </div>
                        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-5 flex items-center border-l-4 border-yellow-500">
                            <div class="w-12 h-12 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center mr-4"><i class="fas fa-hand-holding text-xl"></i></div>
                            <div><p class="text-sm text-gray-500 font-medium">Peminjaman Aktif</p><p class="text-2xl font-bold text-gray-800">${activeLoans}</p></div>
                        </div>
                        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-5 flex items-center border-l-4 border-purple-500">
                            <div class="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center mr-4"><i class="fas fa-boxes text-xl"></i></div>
                            <div><p class="text-sm text-gray-500 font-medium">Data Inventaris</p><p class="text-2xl font-bold text-gray-800">${inventoryData.length}</p></div>
                        </div>
                    </div>
                    
                    <!-- Welcome Card -->
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden relative">
                        <div class="absolute top-0 right-0 p-8 opacity-10 pointer-events-none"><i class="fas fa-university text-9xl text-gov-blue"></i></div>
                        <div class="p-8 relative z-10">
                            <h3 class="text-2xl font-bold text-gov-blue mb-2">Selamat Datang di SIPERPUS</h3>
                            <p class="text-gray-600 mb-6 max-w-2xl">Sistem Informasi Perpustakaan Terpadu. Kelola pendataan koleksi pustaka, keanggotaan, sirkulasi peminjaman, serta inventarisasi buku secara efisien dan profesional dengan sinkronisasi Cloud Database.</p>
                            
                            <div class="flex gap-4">
                                <button onclick="window.navigateTo('circulation')" class="bg-gov-blue hover:bg-blue-800 text-white px-4 py-2 rounded shadow-sm text-sm font-medium transition"><i class="fas fa-plus mr-2"></i> Transaksi Baru</button>
                                <button onclick="window.startCameraScanner('details')" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded shadow-sm text-sm font-medium transition"><i class="fas fa-qrcode mr-2"></i> Scan Buku</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function buildCollectionsView() {
            let trs = booksData.map(b => `
                <tr class="hover:bg-blue-50/50 border-b border-gray-100">
                    <td class="p-4 font-mono text-xs text-gray-500 search-target">${escapeHTML(b.kode_barcode)}</td>
                    <td class="p-4 font-semibold text-gray-800 search-target">${escapeHTML(b.judul)}</td>
                    <td class="p-4 text-gray-600 search-target">${escapeHTML(b.pengarang)}</td>
                    <td class="p-4 text-sm text-gray-500">${escapeHTML(b.kategori)}</td>
                    <td class="p-4 text-center font-bold ${b.stok > 0 ? 'text-green-600' : 'text-red-500'}">${b.stok}</td>
                    <td class="p-4 text-right space-x-1">
                        <button onclick="window.previewBarcode('${b.kode_barcode}', '${escapeHTML(b.judul)}')" title="Lihat Barcode" class="w-8 h-8 rounded bg-gray-100 text-gray-600 hover:bg-gray-200"><i class="fas fa-barcode"></i></button>
                        <button onclick="window.showBookModal(${b.id})" title="Edit" class="w-8 h-8 rounded bg-blue-100 text-blue-600 hover:bg-blue-200"><i class="fas fa-edit"></i></button>
                        <button onclick="window.deleteBook(${b.id})" title="Hapus" class="w-8 h-8 rounded bg-red-100 text-red-600 hover:bg-red-200"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            return `

        window.saveBook = async (e, id) => {
            e.preventDefault();
            const data = { 
                kode_barcode: document.getElementById('b-barcode').value, 
                judul: document.getElementById('b-judul').value, 
                pengarang: document.getElementById('b-pengarang').value, 
                penerbit: document.getElementById('b-penerbit').value, 
                tahun_terbit: parseInt(document.getElementById('b-tahun').value),
                stok: parseInt(document.getElementById('b-stok').value), 
                kategori: document.getElementById('b-kategori').value 
            };
            
            showLoading("Menyimpan Data...");
            try {
                if (id) {
                    const { error } = await supabaseClient.from('books').update(data).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('books').insert([data]);
                    if (error) throw error;
                }
                await fetchAllData();
                closeModal(); window.navigateTo(currentView); showToast("Data buku berhasil disimpan.", "success");
            } catch (err) {
                hideLoading();
                showToast(err.message, "error");
            }
        };

            try {
                // Insert procurement
                const { error: err1 } = await supabaseClient.from('procurements').insert([data]);
                if (err1) throw err1;

                // Update book stock
                const book = booksData.find(b => b.id === bookId);
                const { error: err2 } = await supabaseClient.from('books').update({ stok: book.stok + qty }).eq('id', bookId);
                if(err2) throw err2;

                await fetchAllData();
                closeModal(); window.navigateTo(currentView); showToast("Inventaris dicatat & stok bertambah.", "success");
            } catch (err) {
                hideLoading(); showToast(err.message, "error");
            }
        };

        window.deleteInventory = async (id) => { 
            if(confirm("Hapus catatan inventaris? (Tidak akan mengurangi stok buku)")) { 
                showLoading("Menghapus...");
                try {
                    const { error } = await supabaseClient.from('procurements').delete().eq('id', id);
                    if (error) throw error;
                    await fetchAllData(); window.navigateTo(currentView); showToast("Dihapus.", "success");
                } catch(err) { hideLoading(); showToast(err.message, "error"); }
            } 
        };

        // --- CIRCULATION CRUD ---
        window.showBorrowModal = (prefilledBarcode = '') => {
            const membersOpts = membersData.map(m => `<option value="${m.id}">${escapeHTML(m.nama_lengkap)} (${escapeHTML(m.nomor_anggota)})</option>`).join('');
            const booksOpts = booksData.filter(b => b.stok > 0 || b.kode_barcode === prefilledBarcode).map(b => `<option value="${b.id}" ${b.kode_barcode === prefilledBarcode ? 'selected' : ''}>${escapeHTML(b.judul)} (Sisa: ${b.stok})</option>`).join('');
            
            const html = `
                <form onsubmit="window.processBorrow(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Anggota Peminjam</label>
                        <select id="t-member" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-gov-blue"><option value="" disabled selected>-- Pilih Anggota --</option>${membersOpts}</select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Buku yang Dipinjam</label>
                        <div class="flex gap-2">
                            <select id="t-bookId" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-gov-blue"><option value="" disabled selected>-- Pilih Buku --</option>${booksOpts}</select>
                            <button type="button" onclick="window.startCameraScanner('borrow')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition-colors"><i class="fas fa-qrcode"></i> Scan</button>
                        </div>
                    </div>
                    <div class="mt-8 flex justify-end space-x-3 pt-4 border-t border-gray-100">
                        <button type="button" onclick="window.closeModal()" class="px-4 py-2 border rounded-md text-sm font-medium hover:bg-gray-50">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-gov-gold text-white rounded-md text-sm font-bold shadow-sm hover:bg-yellow-600">Proses Peminjaman</button>
                    </div>
                </form>`;
            openModal('Form Peminjaman Buku', html);
        };

        window.processBorrow = async (e) => {
            e.preventDefault();
            const memberId = parseInt(document.getElementById('t-member').value);
            const bookId = parseInt(document.getElementById('t-bookId').value);
            const book = booksData.find(b => b.id === bookId);

            if (!book || book.stok <= 0) return showToast("Stok buku habis atau buku tidak valid.", "error");

            // Calculate return date (+7 days)
            const today = new Date();
            const returnDate = new Date(today);
            returnDate.setDate(returnDate.getDate() + 7);

            const data = {
                book_id: bookId,
                member_id: memberId,
                user_id: currentUserProfile.id,
                tanggal_pinjam: today.toISOString().split('T')[0],
                batas_kembali: returnDate.toISOString().split('T')[0],
                status: 'Dipinjam'
            };

            showLoading("Memproses Peminjaman...");
            try {
                const { error: err1 } = await supabaseClient.from('transactions').insert([data]);
                if (err1) throw err1;

                const { error: err2 } = await supabaseClient.from('books').update({ stok: book.stok - 1 }).eq('id', bookId);
                if (err2) throw err2;

                await fetchAllData();
                showToast("Transaksi berhasil.", "success"); closeModal(); window.navigateTo(currentView);
            } catch (err) {
                hideLoading(); showToast(err.message, "error");
            }
        };

        window.returnBook = async (transId, bookId) => {
            if(!confirm("Proses pengembalian buku ini?")) return;
            
            showLoading("Memproses Pengembalian...");
            try {
                const todayStr = new Date().toISOString().split('T')[0];
                const { error: err1 } = await supabaseClient.from('transactions').update({ status: 'Dikembalikan', tanggal_dikembalikan: todayStr }).eq('id', transId);
                if (err1) throw err1;

                const book = booksData.find(b => b.id === bookId);
                const { error: err2 } = await supabaseClient.from('books').update({ stok: book.stok + 1 }).eq('id', bookId);
                if (err2) throw err2;

                await fetchAllData();
                showToast("Buku dikembalikan.", "success"); window.navigateTo(currentView);
            } catch(err) { hideLoading(); showToast(err.message, "error"); }
        };

        // --- USER CRUD (SUPERADMIN) ---
        window.showUserModal = () => {
            const html = `
                <form onsubmit="window.saveUser(event)" class="space-y-4">
                    ${formInput('u-username', 'Username Login', '')}
                    ${formInput('u-password', 'Password Sementara', '', 'password')}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peran / Hak Akses</label>
                        <select id="u-role" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-gov-blue">
                            <option value="petugas">Petugas Pustaka</option>
                            <option value="admin">Administrator</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>
                    <div class="mt-8 flex justify-end space-x-3 pt-4 border-t border-gray-100">
                        <button type="button" onclick="window.closeModal()" class="px-4 py-2 border rounded-md text-sm font-medium hover:bg-gray-50">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-gov-blue text-white rounded-md text-sm font-medium shadow-sm hover:bg-blue-800">Simpan Akun</button>
                    </div>
                </form>`;
            openModal('Buat Akun Sistem Baru', html);
        };
        
        window.saveUser = async (e) => {
            e.preventDefault();
            const u = document.getElementById('u-username').value.trim();
            const p = document.getElementById('u-password').value;
            const r = document.getElementById('u-role').value;
            
            showLoading("Membuat Akun...");
            try {
                const { error } = await supabaseClient.from('users').insert([{ username: u, password: p, role: r }]);
                if (error) throw error;
                await fetchAllData(); closeModal(); window.navigateTo(currentView); showToast("Akun berhasil dibuat.", "success");
            } catch (err) { hideLoading(); showToast(err.message, "error"); }
        };

        window.updateUserRole = async (uid, role) => { 
            showLoading("Mengupdate hak akses...");
            try {
                const { error } = await supabaseClient.from('users').update({role: role}).eq('id', uid);
                if (error) throw error;
                await fetchAllData(); showToast("Hak akses diperbarui.", "success");
            } catch(err) { hideLoading(); showToast(err.message, "error"); }
        };

        window.deleteUser = async (uid) => { 
            if(confirm("Hapus akun sistem ini secara permanen?")){ 
                showLoading("Menghapus akun...");
                try {
                    const { error } = await supabaseClient.from('users').delete().eq('id', uid);
                    if(error) throw error;
                    await fetchAllData(); window.navigateTo(currentView);
                } catch(err) { hideLoading(); showToast(err.message, "error"); }
            } 
        };


        /* ==========================================================================
           8. BARCODE SCANNING & PRINTING
           ========================================================================== */

        window.previewBarcode = (barcodeStr, title) => {
            const html = `
                <div class="text-center">
                    <p class="font-bold text-gray-800 mb-4">${escapeHTML(title)}</p>
                    <div class="bg-white p-4 border rounded inline-block"><svg id="barcode-canvas"></svg></div>
                    <div class="mt-6 flex space-x-3 justify-center">
                        <button onclick="window.closeModal()" class="px-4 py-2 border border-gray-300 rounded text-sm font-medium hover:bg-gray-50">Tutup</button>
                        <button onclick="window.printBarcode('${barcodeStr}', '${escapeHTML(title)}')" class="px-4 py-2 bg-gov-blue text-white rounded text-sm font-medium shadow-sm hover:bg-blue-800"><i class="fas fa-print mr-2"></i> Cetak Label</button>
                    </div>
                </div>`;
            openModal('Label Barcode Buku', html);
            setTimeout(() => JsBarcode("#barcode-canvas", barcodeStr, { format: "CODE128", width: 2, height: 60, displayValue: true, fontSize: 14 }), 100);
        };

        window.printBarcode = (barcodeStr, title) => {
            document.getElementById('print-area').classList.remove('hidden');
            document.getElementById('print-title').innerText = title;
            JsBarcode("#print-barcode", barcodeStr, { format: "CODE128", width: 3, height: 100, displayValue: true, fontSize: 18 });
            window.print();
            document.getElementById('print-area').classList.add('hidden');
        };

        window.startCameraScanner = (mode = 'details') => {
            window.currentScannerMode = mode;
            const html = `
                <div class="flex flex-col items-center justify-center">
                    <p class="mb-4 text-sm text-gray-600 text-center font-medium bg-blue-50 p-3 rounded-lg border border-blue-100 w-full"><i class="fas fa-info-circle text-blue-500 mr-2"></i>Arahkan kamera ke barcode buku perpustakaan.</p>
                    <div id="reader" class="w-full max-w-sm rounded overflow-hidden border border-gray-300 shadow-inner bg-black"></div>
                    <button onclick="window.stopCameraScanner()" class="mt-6 px-4 py-2 bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-800 rounded-md text-sm font-medium w-full max-w-[200px] transition"><i class="fas fa-times mr-2"></i> Batalkan</button>
                </div>`;
            openModal('<i class="fas fa-camera mr-2"></i> Pemindai Barcode (Kamera)', html);
            setTimeout(() => {
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100}, aspectRatio: 1.0 }, false);
                html5QrcodeScanner.render(onScanSuccess, () => {});
            }, 200);
        };

        function onScanSuccess(decodedText) {
            window.stopCameraScanner();
            if(window.currentScannerMode === 'borrow') {
                setTimeout(() => window.showBorrowModal(decodedText), 400);
            } else {
                setTimeout(() => window.showBookDetails(decodedText), 400);
            }
        }

        window.stopCameraScanner = () => {
            if(html5QrcodeScanner) { 
                try { html5QrcodeScanner.clear(); } catch(e){} 
                html5QrcodeScanner = null; 
            }
            closeModal();
        };

        window.showBookDetails = (barcodeStr) => {
            const book = booksData.find(b => b.kode_barcode === barcodeStr);
            if(!book) return showToast(`Buku dengan Barcode ${barcodeStr} tidak ditemukan!`, "error");
            
            // Mengambil Asal/Sumber dari Data Pengadaan (Inventaris)
            const inv = inventoryData.find(i => i.book_id === book.id);
            const sumberAsal = inv ? inv.sumber_asal : 'Belum Terdata';
            
            const html = `
                <div class="bg-white text-center">
                    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-book-open text-2xl"></i></div>
                    <h2 class="text-xl font-bold text-gray-800 mb-1">${escapeHTML(book.judul)}</h2>
                    <p class="text-sm font-mono text-gray-500 mb-5 bg-gray-100 inline-block px-3 py-1 rounded"><i class="fas fa-barcode"></i> ${escapeHTML(book.kode_barcode)}</p>
                    
                    <div class="grid grid-cols-2 gap-3 text-left mb-6">
                        <div class="bg-gray-50 p-3 rounded border border-gray-100"><p class="text-xs text-gray-500">Penulis</p><p class="text-sm font-semibold text-gray-800">${escapeHTML(book.pengarang)}</p></div>
                        <div class="bg-gray-50 p-3 rounded border border-gray-100"><p class="text-xs text-gray-500">Kategori</p><p class="text-sm font-semibold text-gray-800">${escapeHTML(book.kategori)}</p></div>
                        <div class="bg-gray-50 p-3 rounded border border-gray-100"><p class="text-xs text-gray-500">Tahun</p><p class="text-sm font-semibold text-gray-800">${escapeHTML(book.tahun_terbit || '-')}</p></div>
                        <div class="bg-gray-50 p-3 rounded border border-gray-100"><p class="text-xs text-gray-500">Asal / Sumber</p><p class="text-sm font-semibold text-gray-800">${escapeHTML(sumberAsal)}</p></div>
                        <div class="bg-blue-50 p-3 rounded border border-blue-100 col-span-2 flex justify-between items-center"><p class="text-sm font-semibold text-blue-600">Sisa Stok Tersedia:</p><p class="text-xl font-bold text-blue-800">${book.stok} Eks</p></div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="window.closeModal()" class="flex-1 py-2 bg-gray-100 border border-gray-300 hover:bg-gray-200 rounded-md text-sm font-medium text-gray-700">Tutup</button>
                        ${book.stok > 0 ? `<button onclick="window.closeModal(); setTimeout(()=>window.showBorrowModal('${book.kode_barcode}'), 300);" class="flex-1 py-2 bg-gov-blue hover:bg-blue-800 text-white rounded-md text-sm font-medium shadow-sm"><i class="fas fa-exchange-alt mr-2"></i> Pinjamkan</button>` : ''}
                    </div>
                </div>`;
            openModal('Informasi Detail Buku', html);
        };

        // Listen for Physical Barcode Scanner
        document.addEventListener('keypress', function(e) {
            if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return; 
            if (e.key === 'Enter' && physicalBarcode.length > 3) {
                if(window.currentScannerMode === 'borrow' && !document.getElementById('custom-modal').classList.contains('hidden') && document.getElementById('t-bookId')) {
                    const select = document.getElementById('t-bookId');
                    // Find option where text matches barcode
                    const b = booksData.find(x => x.kode_barcode === physicalBarcode);
                    if(b && [...select.options].some(o => o.value == b.id)) {
                        select.value = b.id;
                        showToast("Barcode terdeteksi", "success");
                    } else {
                        showToast("Buku tidak valid/stok habis", "error");
                    }
                } else {
                    window.showBookDetails(physicalBarcode);
                }
                physicalBarcode = '';
            } else {
                physicalBarcode += e.key;
                if(physicalBarcodeTimer) clearTimeout(physicalBarcodeTimer);
                physicalBarcodeTimer = setTimeout(() => physicalBarcode = '', 100);
            }
        });


        /* ==========================================================================
           9. UTILITIES
           ========================================================================== */

        window.toggleSidebar = () => { 
            document.getElementById('sidebar').classList.toggle('-translate-x-full'); 
            document.getElementById('sidebar-overlay').classList.toggle('hidden'); 
        };
        
        window.openModal = (titleHTML, contentHTML) => { 
            if(html5QrcodeScanner && !contentHTML.includes('reader')) window.stopCameraScanner(); 
            document.getElementById('modal-title').innerHTML = titleHTML; 
            document.getElementById('modal-body').innerHTML = contentHTML; 
            const m = document.getElementById('custom-modal'); 
            m.classList.remove('hidden'); 
            void m.offsetWidth; 
            m.classList.remove('opacity-0'); 
            document.getElementById('modal-content').classList.remove('scale-95'); 
        };
        
        window.closeModal = () => { 
            if(html5QrcodeScanner) window.stopCameraScanner();
            const m = document.getElementById('custom-modal'); 
            m.classList.add('opacity-0'); 
            document.getElementById('modal-content').classList.add('scale-95'); 
            setTimeout(() => { m.classList.add('hidden'); document.getElementById('modal-body').innerHTML = ''; }, 300); 
        };
        
        function showLoading(text = 'Memuat...') { 
            const l = document.getElementById('loading-overlay'); 
            document.getElementById('loading-text').innerText = text; 
            l.classList.remove('opacity-0', 'pointer-events-none', 'hidden'); 
        }
        
        function hideLoading() { 
            const l = document.getElementById('loading-overlay'); 
            l.classList.add('opacity-0', 'pointer-events-none'); 
            setTimeout(() => l.classList.add('hidden'), 500); 
        }
        
        window.showToast = (msg, type='info') => {
            const c = document.getElementById('toast-container'); 
            const t = document.createElement('div');
            let bg = type==='success'?'bg-green-600':(type==='error'?'bg-red-600':(type==='warning'?'bg-yellow-500':'bg-blue-600'));
            let icon = type==='success'?'fa-check-circle':(type==='error'?'fa-times-circle':'fa-info-circle');
            t.className = `px-4 py-3 rounded shadow-xl text-white text-sm font-medium ${bg} transform transition-all duration-300 translate-x-[120%] flex items-center border border-white/20`;
            t.innerHTML = `<i class="fas ${icon} mr-2 text-lg"></i> ${msg}`;
            c.appendChild(t); 
            setTimeout(() => t.classList.remove('translate-x-[120%]'), 10);
            setTimeout(() => { t.classList.add('translate-x-[120%]'); setTimeout(() => t.remove(), 300); }, 3000);
        };
        
        window.filterTable = (tableId, query) => {
            const table = document.getElementById(tableId); if(!table) return; 
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
            for(let i=0; i<rows.length; i++) {
                if(rows[i].cells.length===1) continue; 
                let match = false; 
                const targets = rows[i].getElementsByClassName('search-target');
                for(let j=0; j<targets.length; j++) if(targets[j].innerText.toLowerCase().includes(query.toLowerCase())) match = true;
                rows[i].style.display = match ? '' : 'none';
            }
        };
        
        function escapeHTML(s) { return String(s||'').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t)); }
        function formatDateShort(s) { return s ? new Date(s).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '-'; }

        // Start App
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
