<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Katalog publik perpustakaan SIPERPUS.">
  <title>Katalog OPAC - SIPERPUS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { gov: { blue: '#1e3a8a', gold: '#f59e0b' } }
        }
      }
    };
  </script>
  <style>body { font-family: Inter, sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800">
  <header class="sticky top-0 z-10 bg-gov-blue text-white shadow-md">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <div class="flex items-center gap-3">
        <i class="fas fa-book-reader text-3xl text-gov-gold" aria-hidden="true"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Katalog OPAC</h1>
          <p class="text-xs text-blue-200">Online Public Access Catalog SIPERPUS</p>
        </div>
      </div>
      <a href="index.html" class="inline-flex items-center justify-center rounded-md border border-blue-700 bg-blue-800 px-4 py-2 text-sm font-medium hover:bg-blue-900">
        <i class="fas fa-sign-in-alt mr-2" aria-hidden="true"></i> Login Pengelola
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <section class="mb-7 rounded-xl border border-gray-200 bg-white p-5 shadow-sm sm:p-6" aria-labelledby="search-heading">
      <h2 id="search-heading" class="mb-4 text-lg font-bold"><i class="fas fa-search mr-2 text-gov-blue" aria-hidden="true"></i>Cari koleksi buku</h2>
      <div class="flex flex-col gap-3 sm:flex-row">
        <label class="sr-only" for="search-field">Bidang pencarian</label>
        <select id="search-field" class="rounded-lg border border-gray-300 bg-gray-50 px-3 py-3 text-sm focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200 sm:w-52">
          <option value="all">Semua informasi</option>
          <option value="judul">Judul buku</option>
          <option value="pengarang">Pengarang</option>
          <option value="penerbit">Penerbit</option>
          <option value="kategori">Kategori</option>
          <option value="nomor_panggil">Nomor panggil</option>
          <option value="nomor_rak">Nomor / lokasi rak</option>
        </select>
        <label class="sr-only" for="search-input">Kata kunci</label>
        <div class="relative flex-1">
          <i class="fas fa-search absolute left-4 top-3.5 text-gray-400" aria-hidden="true"></i>
          <input id="search-input" type="search" autocomplete="off" placeholder="Ketik judul, pengarang, penerbit, atau kata kunci..." class="w-full rounded-lg border border-gray-300 py-3 pl-11 pr-4 text-sm focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200">
        </div>
      </div>
      <p id="status-message" class="mt-3 text-sm text-gray-500" role="status" aria-live="polite">Memuat katalog...</p>
    </section>

    <section aria-label="Hasil katalog">
      <div id="results" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
      <div id="empty-state" class="hidden rounded-xl border border-dashed border-gray-300 bg-white px-6 py-12 text-center">
        <i class="fas fa-book-open mb-3 text-4xl text-gray-300" aria-hidden="true"></i>
        <p class="font-medium text-gray-600">Buku tidak ditemukan.</p>
        <p class="mt-1 text-sm text-gray-500">Coba kata kunci atau bidang pencarian yang berbeda.</p>
      </div>
    </section>
  </main>

  <footer class="mt-10 border-t border-gray-200 bg-white py-5 text-center text-xs text-gray-500">
    SIPERPUS · Katalog publik perpustakaan
  </footer>

  <script>
    // Gunakan URL dan publishable/anon key proyek SIPERPUS yang sama dengan index.html.
    const SUPABASE_URL = 'https://blimhihjptvakbgrbbao.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0kdE_oPP51ftVu5KEazuqw_b2e4XSPI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const resultsElement = document.getElementById('results');
    const emptyElement = document.getElementById('empty-state');
    const statusElement = document.getElementById('status-message');
    const searchInput = document.getElementById('search-input');
    const searchField = document.getElementById('search-field');
    let allBooks = [];

    function text(value, fallback = '-') {
      return value === null || value === undefined || String(value).trim() === '' ? fallback : String(value);
    }

    function addInfoRow(parent, label, value) {
      const row = document.createElement('div');
      row.className = 'flex items-start justify-between gap-3 text-sm';
      const key = document.createElement('span');
      key.className = 'shrink-0 text-gray-500';
      key.textContent = label;
      const val = document.createElement('span');
      val.className = 'text-right font-medium text-gray-800';
      val.textContent = value;
      row.append(key, val);
      parent.appendChild(row);
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
      } catch (_) {
        return null;
      }
    }

    function createBookCard(book) {
      const card = document.createElement('article');
      card.className = 'flex h-full flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm transition hover:shadow-md';
      const body = document.createElement('div');
      body.className = 'flex flex-1 flex-col p-5';

      const title = document.createElement('h2');
      title.className = 'mb-2 text-lg font-bold leading-snug text-gray-900';
      title.textContent = text(book.judul, 'Judul tidak tersedia');
      body.appendChild(title);

      const author = document.createElement('p');
      author.className = 'mb-4 text-sm text-gray-600';
      author.textContent = `Pengarang: ${text(book.pengarang)}`;
      body.appendChild(author);

      const details = document.createElement('div');
      details.className = 'mb-4 space-y-2 rounded-lg bg-gray-50 p-3';
      addInfoRow(details, 'Kategori', text(book.kategori));
      addInfoRow(details, 'Penerbit', text(book.penerbit));
      addInfoRow(details, 'Tahun', text(book.tahun_terbit));
      addInfoRow(details, 'Nomor panggil', text(book.nomor_panggil || book.katalog));
      addInfoRow(details, 'Lokasi rak', text(book.lokasi_rak || book.nomor_rak));
      body.appendChild(details);

      const footer = document.createElement('div');
      footer.className = 'mt-auto flex flex-wrap items-center justify-between gap-2 border-t border-gray-100 pt-4';
      const barcode = document.createElement('span');
      barcode.className = 'text-xs text-gray-500';
      barcode.textContent = `Barcode: ${text(book.kode_barcode)}`;
      const stock = Number(book.stok) || 0;
      const badge = document.createElement('span');
      badge.className = stock > 0
        ? 'rounded-full border border-green-200 bg-green-50 px-2.5 py-1 text-xs font-semibold text-green-700'
        : 'rounded-full border border-red-200 bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700';
      badge.textContent = stock > 0 ? `Tersedia (${stock})` : 'Tidak tersedia';
      footer.append(barcode, badge);
      body.appendChild(footer);

      const digitalUrl = book.link_digital ? safeHttpUrl(book.link_digital) : null;
      if (digitalUrl) {
        const link = document.createElement('a');
        link.href = digitalUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'mt-4 block rounded-md border border-blue-200 bg-blue-50 px-3 py-2 text-center text-sm font-semibold text-gov-blue hover:bg-blue-100';
        link.innerHTML = '<i class="fas fa-external-link-alt mr-2" aria-hidden="true"></i>Buka bahan digital';
        body.appendChild(link);
      }

      card.appendChild(body);
      return card;
    }

    function renderBooks(books) {
      resultsElement.replaceChildren();
      emptyElement.classList.toggle('hidden', books.length > 0);
      books.forEach(book => resultsElement.appendChild(createBookCard(book)));
      statusElement.textContent = `${books.length} koleksi ditemukan.`;
    }

    function applySearch() {
      const query = searchInput.value.trim().toLocaleLowerCase('id');
      const field = searchField.value;
      const filtered = allBooks.filter(book => {
        const fields = field === 'all'
          ? ['judul', 'pengarang', 'penerbit', 'kategori', 'nomor_panggil', 'nomor_rak', 'lokasi_rak', 'katalog', 'kode_barcode']
          : [field, ...(field === 'nomor_panggil' ? ['katalog'] : []), ...(field === 'nomor_rak' ? ['lokasi_rak'] : [])];
        return fields.some(key => String(book[key] ?? '').toLocaleLowerCase('id').includes(query));
      });
      renderBooks(filtered);
    }

    async function loadBooks() {
      statusElement.textContent = 'Memuat katalog...';
      try {
        const { data, error } = await supabaseClient
          .from('books')
          .select('id, kode_barcode, judul, pengarang, penerbit, tahun_terbit, kategori, stok, katalog, nomor_rak, nomor_panggil, lokasi_rak, link_digital')
          .order('judul', { ascending: true });
        if (error) throw error;
        allBooks = data || [];
        renderBooks(allBooks);
      } catch (error) {
        console.error('Gagal memuat katalog:', error);
        resultsElement.replaceChildren();
        emptyElement.classList.add('hidden');
        statusElement.textContent = 'Katalog gagal dimuat. Pastikan koneksi Supabase aktif dan kebijakan SELECT publik untuk tabel books sudah diatur.';
      }
    }

    searchInput.addEventListener('input', applySearch);
    searchField.addEventListener('change', applySearch);
    loadBooks();
  </script>
</body>
</html>
